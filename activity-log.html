<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Activity Log — Outcomes Review Tool</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='1' y='1' width='22' height='22' rx='6' fill='white' stroke='%23d8d8d8' stroke-width='1'/%3E%3Cpolygon points='5,9 12,4 19,9 16,9 12,6.5 8,9' fill='%23dc3c2d'/%3E%3Crect x='7' y='10' width='2.5' height='9' fill='%231c6ea4'/%3E%3Crect x='14.5' y='10' width='2.5' height='9' fill='%231c6ea4'/%3E%3Crect x='9.5' y='13.5' width='5' height='2' fill='%231c6ea4'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="brand">
    <svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true">
      <rect x="1" y="1" width="22" height="22" rx="6" style="fill: var(--card-bg); stroke: var(--border); stroke-width: 1"></rect>
      <polygon points="5,9 12,4 19,9 16,9 12,6.5 8,9" style="fill: var(--brand-red)"></polygon>
      <rect x="7" y="10" width="2.5" height="9" style="fill: var(--accent)"></rect>
      <rect x="14.5" y="10" width="2.5" height="9" style="fill: var(--accent)"></rect>
      <rect x="9.5" y="13.5" width="5" height="2" style="fill: var(--accent)"></rect>
    </svg>
    <h1>Outcomes Review Tool</h1>
  </div>
  <nav>
    <a href="index.html">Outcomes</a>
    <a href="add.html">Add Outcome</a>
    <a href="reconcile.html">Reconcile</a>
    <a href="activity-log.html" class="active">Activity Log</a>
  </nav>
  <button type="button" id="current-user-btn" class="current-user-btn" title="Click to change"></button>
</header>

<main>
  <section class="card">
    <div class="card-header">
      <h2>Activity Log</h2>
      <span class="count-badge" id="activity-log-count">0</span>
      <span class="hint">records removed from the tables above, via delete or documented-in-HMIS — newest first</span>
      <label class="sort-control">
        Show
        <select id="activity-log-filter">
          <option value="all" selected>All activity</option>
          <option value="deleted">Deleted only</option>
          <option value="documented_in_hmis">Documented in HMIS only</option>
        </select>
      </label>
    </div>
    <div class="table-scroll">
      <table id="activity-log-table">
        <thead>
          <tr>
            <th>When</th>
            <th>Action</th>
            <th>ID</th>
            <th>Guest</th>
            <th>Classification</th>
            <th>Type</th>
            <th>Case Manager</th>
            <th>By</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <p class="empty-state" id="activity-log-empty">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 5h12M2 8h12M2 11h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span id="activity-log-empty-text">No activity logged yet.</span>
    </p>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
