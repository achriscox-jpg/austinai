name: Test failure notification

# Throwaway workflow to confirm GitHub's "Only notify for failed workflows"
# Actions notification setting actually delivers an email. Manual trigger
# only - never runs on a schedule, never touches Outlook/Anthropic/Supabase,
# no secrets used. Fails on purpose, immediately, then there's nothing else
# to clean up. Delete this file (and the branch it lives on) once the test
# email is confirmed - it's not meant to stick around.

on:
  workflow_dispatch: {}

jobs:
  fail-on-purpose:
    runs-on: ubuntu-latest
    steps:
      - name: Deliberately fail
        run: |
          echo "This is a deliberate test failure - confirming GitHub Actions failure-notification settings work, nothing is actually broken."
          exit 1
