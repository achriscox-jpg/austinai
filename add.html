<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Outcome — Outcomes Review Tool</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpolygon points='12,2 22,11 2,11' fill='%23dc3c2d'/%3E%3Crect x='5' y='11' width='14' height='11' rx='1' fill='%231c6ea4'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true">
      <polygon points="12,2 22,11 2,11" style="fill: var(--brand-red)"></polygon>
      <rect x="5" y="11" width="14" height="11" rx="1" style="fill: var(--accent)"></rect>
    </svg>
    <h1>Outcomes Review Tool</h1>
  </div>
  <nav>
    <a href="index.html">Outcomes</a>
    <a href="add.html" class="active">Add Outcome</a>
  </nav>
</header>

<main>
  <section class="card">
    <div class="card-header"><h2>Add Outcome</h2></div>
    <form id="add-form" class="record-form">
      <label>
        Table
        <select name="table">
          <option value="followup">Needs Follow-up</option>
          <option value="completed">Completed</option>
        </select>
      </label>

      <label>
        ID
        <input type="text" name="guestId">
      </label>

      <label>
        Guest
        <input type="text" name="guest" required>
      </label>

      <label>
        Classification <span class="hint">(broad category, e.g. Housing, Employment, Benefits)</span>
        <input type="text" name="classification" required>
      </label>

      <label>
        Type <span class="hint">(the specific outcome, e.g. Permanent housing placement)</span>
        <input type="text" name="type" required>
      </label>

      <label>
        Date
        <input type="date" name="date" required>
      </label>

      <label>
        Case manager
        <input type="text" name="caseManager">
      </label>

      <label>
        Source email reference/snippet
        <textarea name="sourceSnippet"></textarea>
      </label>

      <label>
        Notes <span class="hint">(follow-up detail, or any other context)</span>
        <textarea name="notes"></textarea>
      </label>

      <div class="form-actions">
        <button type="submit" class="btn-primary">Add Outcome</button>
        <a href="index.html">Cancel</a>
      </div>
    </form>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
