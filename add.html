<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Outcome — Outcomes Review Tool</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='1' y='1' width='22' height='22' rx='6' fill='white' stroke='%23d8d8d8' stroke-width='1'/%3E%3Cpolygon points='5,9 12,4 19,9 16,9 12,6.5 8,9' fill='%23dc3c2d'/%3E%3Crect x='7' y='10' width='2.5' height='9' fill='%231c6ea4'/%3E%3Crect x='14.5' y='10' width='2.5' height='9' fill='%231c6ea4'/%3E%3Crect x='9.5' y='13.5' width='5' height='2' fill='%231c6ea4'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="brand">
    <svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true">
      <rect x="1" y="1" width="22" height="22" rx="6" style="fill: var(--card-bg); stroke: var(--border); stroke-width: 1"></rect>
      <polygon points="5,9 12,4 19,9 16,9 12,6.5 8,9" style="fill: var(--brand-red)"></polygon>
      <rect x="7" y="10" width="2.5" height="9" style="fill: var(--accent)"></rect>
      <rect x="14.5" y="10" width="2.5" height="9" style="fill: var(--accent)"></rect>
      <rect x="9.5" y="13.5" width="5" height="2" style="fill: var(--accent)"></rect>
    </svg>
    <h1>Outcomes Review Tool</h1>
  </div>
  <nav>
    <a href="index.html">Outcomes</a>
    <a href="add.html" class="active">Add Outcome</a>
  </nav>
</header>

<main>
  <section class="card">
    <div class="card-header"><h2>Add Outcome</h2></div>
    <form id="add-form" class="record-form">
      <label>
        Table
        <select name="table">
          <option value="followup">Needs Follow-up</option>
          <option value="completed">Completed</option>
        </select>
      </label>

      <label>
        ID
        <input type="text" name="guestId">
      </label>

      <label>
        Guest
        <input type="text" name="guest">
      </label>

      <label>
        Classification <span class="hint">(broad category)</span>
        <select name="classification"></select>
      </label>

      <label>
        Type <span class="hint">(the specific outcome within that classification)</span>
        <select name="type"></select>
      </label>

      <label>
        Date
        <input type="date" name="date">
      </label>

      <label>
        Case manager
        <input type="text" name="caseManager">
      </label>

      <label>
        Source email reference/snippet
        <textarea name="sourceSnippet"></textarea>
      </label>

      <label>
        Notes <span class="hint">(follow-up detail, or any other context)</span>
        <textarea name="notes"></textarea>
      </label>

      <div class="form-actions">
        <button type="submit" class="btn-primary">
          <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          Add Outcome
        </button>
        <a href="index.html">
          <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          Cancel
        </a>
      </div>
    </form>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
